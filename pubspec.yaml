name: kakawise
description: On-device cacao pod variety classifier — YOLOv12 segmentation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_onnxruntime: ^1.5.1

  image: ^4.2.0

  # ── Image picking ─────────────────────────────────────────────────────────
  image_picker: ^1.1.2

  # ── UI ────────────────────────────────────────────────────────────────────
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.0

  # ── Utils ─────────────────────────────────────────────────────────────────
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#2E7D32"
  image: assets/images/kakawiselogo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/kakawisev12_seg.onnx
