name: kakawise
description: On-device cacao pod variety classifier — YOLOv12 segmentation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── On-device YOLOv12 inference (Ultralytics Flutter SDK) ────────────────
  # Supports .tflite models on Android/iOS via TensorFlow Lite delegate.
  # See: https://pub.dev/packages/ultralytics_yolo
  ultralytics_yolo: ^0.3.0

  # ── Image ─────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2         # Camera + gallery
  image: ^4.1.7                # Pixel-level image compositing for rendered overlay

  # ── UI ────────────────────────────────────────────────────────────────────
  google_fonts: ^8.0.2
  flutter_animate: ^4.5.0

  # ── Utils ─────────────────────────────────────────────────────────────────
  path_provider: ^2.1.3        # Temporary directory for saving rendered image
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/